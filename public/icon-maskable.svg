<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background — adaptive icon masking expects edge-to-edge fill -->
  <rect width="512" height="512" fill="url(#bg-m)"/>

  <!-- F mark scaled into the central 60% safe zone (Android adaptive icons may
       crop up to 20% on any edge, so the glyph stays inside ~y 156–356, x 156–356). -->
  <g transform="translate(176 168)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="40" height="220" rx="20" ry="20" fill="url(#accent-m)"/>
    <!-- Top arm -->
    <rect x="0" y="0" width="168" height="40" rx="20" ry="20" fill="url(#accent-m)"/>
    <!-- Middle arm -->
    <rect x="0" y="80" width="128" height="40" rx="20" ry="20" fill="url(#accent-m)"/>
    <!-- Bottom arm -->
    <rect x="0" y="160" width="88" height="40" rx="20" ry="20" fill="url(#accent-m)"/>
  </g>
</svg>
