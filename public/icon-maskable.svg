<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Maskable icons need a "safe zone" — keep critical content within a 64px-radius circle (centered).
       The full 512×512 is mostly background to survive adaptive icon masking. -->
  <rect width="512" height="512" fill="url(#bg-m)"/>

  <!-- Stylized F — kept inside the central 60% safe zone -->
  <g transform="translate(176 168)">
    <rect x="0" y="0" width="40" height="220" rx="16" ry="16" fill="url(#accent-m)"/>
    <rect x="0" y="0" width="160" height="40" rx="16" ry="16" fill="url(#accent-m)"/>
    <rect x="0" y="88" width="120" height="34" rx="14" ry="14" fill="url(#accent-m)"/>
  </g>
</svg>
