<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinScroll — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }
    .logo-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #fafafa;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.5;
      max-width: 340px;
      margin-bottom: 28px;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f87171;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    button {
      background: #10b981;
      color: #09090b;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 24px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 150ms;
    }
    button:hover { background: #34d399; }
    .hint {
      margin-top: 32px;
      font-size: 12px;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-mark">F</div>
    <div class="logo-name">FinScroll</div>
  </div>

  <h1><span class="pulse"></span>You're offline</h1>
  <p>
    Your scroll connection dipped.
    Reconnect to keep building your financial knowledge — your streak is safe.
  </p>
  <button onclick="location.reload()">Try Again</button>

  <p class="hint">
    The 12 curated FinTok cards are cached locally and will work without internet.
  </p>
</body>
</html>
