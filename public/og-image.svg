<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="mark-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo lockup: brand chip + wordmark -->
  <g transform="translate(72 72)">
    <!-- 56×56 emerald chip -->
    <rect x="0" y="0" width="56" height="56" rx="16" ry="16"
          fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Geometric F mark — same geometry as icon.svg, scaled to fit chip.
         Source glyph is 240×320; scale 0.125 gives 30×40, centered with
         13px left + 8px top padding inside the 56×56 chip. -->
    <g transform="translate(13 8) scale(0.125)">
      <rect x="0" y="0" width="56" height="320" rx="28" ry="28" fill="url(#mark-accent)"/>
      <rect x="0" y="0" width="240" height="56" rx="28" ry="28" fill="url(#mark-accent)"/>
      <rect x="0" y="112" width="184" height="56" rx="28" ry="28" fill="url(#mark-accent)"/>
      <rect x="0" y="224" width="128" height="56" rx="28" ry="28" fill="url(#mark-accent)"/>
    </g>

    <!-- Wordmark -->
    <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="28" font-weight="800" fill="#fafafa" letter-spacing="-0.5">FinScroll</text>
  </g>

  <!-- Hero text -->
  <g transform="translate(72 200)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="92" font-weight="900" fill="#fafafa" letter-spacing="-3">Stop</text>
    <text x="0" y="96" font-size="92" font-weight="900" fill="url(#rose)" letter-spacing="-3">Doomscrolling.</text>
    <text x="0" y="192" font-size="92" font-weight="900" fill="#fafafa" letter-spacing="-3">Start</text>
    <text x="0" y="288" font-size="92" font-weight="900" fill="url(#emerald)" letter-spacing="-3">Wealth-Building.</text>
  </g>

  <!-- Bottom tagline + powered by -->
  <g transform="translate(72 568)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="22" font-weight="600" fill="#a1a1aa">
      TikTok-style scroll cards · Grounded in SEC research · Powered by Google Gemini
    </text>
  </g>
</svg>
