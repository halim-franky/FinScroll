<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Inner glow ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" ry="96"
        fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Stylized F: vertical bar + two arms suggesting a scroll -->
  <g transform="translate(128 96)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="56" height="320" rx="24" ry="24" fill="url(#accent)"/>
    <!-- Top arm -->
    <rect x="0" y="0" width="240" height="56" rx="24" ry="24" fill="url(#accent)"/>
    <!-- Middle arm -->
    <rect x="0" y="128" width="176" height="48" rx="20" ry="20" fill="url(#accent)"/>
  </g>

  <!-- Upward arrow indicating wealth growth -->
  <g transform="translate(352 96)" opacity="0.9">
    <path d="M0 80 L32 16 L64 80" stroke="#10b981" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
