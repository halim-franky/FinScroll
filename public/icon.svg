<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle emerald glow ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" ry="96"
        fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="2"/>

  <!-- F mark: vertical stem + three arms of decreasing length.
       Reads as (a) letter F, (b) a vertical scroll feed of cards,
       and (c) a downward chart trend if you flip it. -->
  <g transform="translate(128 96)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="56" height="320" rx="28" ry="28" fill="url(#accent)"/>
    <!-- Top arm: widest, the F's header -->
    <rect x="0" y="0" width="240" height="56" rx="28" ry="28" fill="url(#accent)"/>
    <!-- Middle arm: medium -->
    <rect x="0" y="112" width="184" height="56" rx="28" ry="28" fill="url(#accent)"/>
    <!-- Bottom arm: shortest, evokes the third card in a scroll feed -->
    <rect x="0" y="224" width="128" height="56" rx="28" ry="28" fill="url(#accent)"/>
  </g>
</svg>
